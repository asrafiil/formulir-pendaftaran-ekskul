<!DOCTYPE html>
<html lang="id">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Digital Profile Card</title>
	<!-- Menghubungkan file HTML dengan file CSS eksternal -->
	<link rel="stylesheet" href="style.css">
</head>
<body>

	<!-- Kartu kontainer utama -->
	<div class="profile-card">

		<!-- Badge status aktif -->
		<span class="badge">ready to code</span>

		<!-- Foto profil -->
		<img src="https://img.a.transfermarkt.technology/portrait/big/8198-1748102259.jpg?lm=1">

		<!-- Nama & peran -->
		<h1>aploy dan fathir ganteng</h1>
		<p class="role">UI/UX Designer & Student RPL</p>
		
		<!-- Bio / Deskripsi singkat -->
		<p class="bio">main futsal.</p>

		<!-- Tombol Aksi / Media Sosial -->
		<div class="social-links">
			<a href="#" class="btn github">Github</a>
			<a href="#" class="btn instagram">Instagram</a>
		</div>

	</div>

</body>
</html>
