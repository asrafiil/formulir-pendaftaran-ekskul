<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="text.css">
    <title>Pendaftaran Futsal</title>
</head>
<body>


    <div class="profile-card">
        
        <div class="form-header">
            
            <span class="badge">ATLET ??</span>
            <h2>Join SPORT CLUB</h2>
            <p>join dan menjadi seorang atlet!</p>
        </div>

        <form>
            <div class="Input-Group">
                <label for="nama">Nama Lengkap</label>
            
                <input type="text" id="nama" placeholder="AFLAH ATAU FATHIR" required>
            </div>

            <div class="Input-Group">
                <label for="kelas">Kelas</label>
                <input type="text" id="kelas" placeholder="XI RPL" required>
            </div>

            
            <div class="Input-Group">
                <label for="alasan">Ingin masuk Futsal?</label>
                <textarea id="alasan" rows="3" placeholder="Tulis alasanmu di sini" required></textarea>
            </div>

            <button type="submit" class="btn btn-submit">Kirim Pendaftaran</button>
        </form>

    </div>

</body>
</html>
